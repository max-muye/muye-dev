<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Snake game with configurable board, apples, bombs, and AI snakes.">
    <title>Snake · Muye Games</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="/styles.css?v=11">
    <link rel="stylesheet" href="/games/snake/snake.css?v=3">
    <link rel="stylesheet" href="/assets/site-footer.css?v=1">
  </head>
  <body class="game-page">
    <main class="snake-shell">
      <header class="game-topbar">
        <a class="game-brand" href="/games/" data-snake-i18n="games">Games</a>
        <a class="game-home" href="/" data-snake-i18n="home">Home</a>
      </header>

      <section class="snake-app" aria-labelledby="snake-title">
        <div class="snake-heading">
          <div>
            <p class="eyebrow" data-snake-i18n="muyeGames">Muye games</p>
            <h1 id="snake-title">Snake</h1>
          </div>
          <div class="snake-score" aria-live="polite">
            <span data-snake-i18n="score">Score</span>
            <strong id="score">0</strong>
          </div>
        </div>

        <form class="snake-controls" id="settings">
          <label><span data-snake-i18n="width">Width</span><input name="width" type="number" min="1" step="1" value="30" inputmode="numeric"></label>
          <label><span data-snake-i18n="height">Height</span><input name="height" type="number" min="1" step="1" value="30" inputmode="numeric"></label>
          <label><span data-snake-i18n="apples">Max apples</span><input name="apples" type="number" min="0" step="1" value="10" inputmode="numeric"></label>
          <label><span data-snake-i18n="bombs">Max bombs</span><input name="bombs" type="number" min="0" step="1" value="10" inputmode="numeric"></label>
          <label><span data-snake-i18n="aiSnakes">AI snakes</span><input name="ais" type="number" min="0" step="1" value="5" inputmode="numeric"></label>
          <label><span data-snake-i18n="ticks">Ticks</span><input name="ticks" type="number" min="1" step="1" value="95" inputmode="numeric"></label>
          <label class="snake-check"><input name="playerAi" type="checkbox"> <span data-snake-i18n="aiMode">AI mode</span></label>
          <button class="snake-button" type="submit" data-snake-i18n="start">Start</button>
        </form>

        <div class="snake-board-wrap">
          <canvas id="board" width="900" height="900" aria-label="Snake game board"></canvas>
          <div class="snake-overlay" id="overlay">
            <strong data-snake-i18n="ready">Ready</strong>
            <span data-snake-i18n="help">Use arrow keys, WASD, swipe, or AI mode.</span>
          </div>
        </div>

        <div class="snake-status">
          <p id="status" data-snake-i18n="pressStart">Press Start to play.</p>
          <button class="snake-button secondary" id="pause" type="button" data-snake-i18n="pause">Pause</button>
        </div>
      </section>
    </main>
    <script src="/games/snake/snake.js?v=5"></script>
    <script src="/assets/site-footer.js?v=1"></script>
  </body>
</html>
