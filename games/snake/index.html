<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Snake game with configurable board, apples, bombs, and AI snakes.">
    <title>Snake · Muye Games</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=11">
    <link rel="stylesheet" href="/games/snake/snake.css?v=3">
  </head>
  <body class="game-page">
    <main class="snake-shell">
      <header class="game-topbar">
        <a class="game-brand" href="/games/">Games</a>
        <a class="game-home" href="/">Home</a>
      </header>

      <section class="snake-app" aria-labelledby="snake-title">
        <div class="snake-heading">
          <div>
            <p class="eyebrow">Muye games</p>
            <h1 id="snake-title">Snake</h1>
          </div>
          <div class="snake-score" aria-live="polite">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
        </div>

        <form class="snake-controls" id="settings">
          <label>Width<input name="width" type="number" min="1" step="1" value="30" inputmode="numeric"></label>
          <label>Height<input name="height" type="number" min="1" step="1" value="30" inputmode="numeric"></label>
          <label>Max apples<input name="apples" type="number" min="0" step="1" value="10" inputmode="numeric"></label>
          <label>Max bombs<input name="bombs" type="number" min="0" step="1" value="10" inputmode="numeric"></label>
          <label>AI snakes<input name="ais" type="number" min="0" step="1" value="5" inputmode="numeric"></label>
          <label>Ticks<input name="ticks" type="number" min="1" step="1" value="95" inputmode="numeric"></label>
          <label class="snake-check"><input name="playerAi" type="checkbox"> AI mode</label>
          <button class="snake-button" type="submit">Start</button>
        </form>

        <div class="snake-board-wrap">
          <canvas id="board" width="900" height="900" aria-label="Snake game board"></canvas>
          <div class="snake-overlay" id="overlay">
            <strong>Ready</strong>
            <span>Use arrow keys, WASD, swipe, or AI mode.</span>
          </div>
        </div>

        <div class="snake-status">
          <p id="status">Press Start to play.</p>
          <button class="snake-button secondary" id="pause" type="button">Pause</button>
        </div>
      </section>
    </main>
    <script src="/games/snake/snake.js?v=4"></script>
  </body>
</html>
