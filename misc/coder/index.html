<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Muye encoder and decoder.">
    <title>Coder · Muye</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=11">
    <link rel="stylesheet" href="/misc/coder/coder.css?v=1">
  </head>
  <body class="misc-page">
    <main class="misc-shell">
      <header class="misc-topbar">
        <a class="misc-brand" href="/">Muye</a>
        <a class="misc-home" href="/">Home</a>
      </header>

      <section class="codec-tool" aria-labelledby="codec-title">
        <div>
          <p class="eyebrow">Misc / Coder</p>
          <h1 id="codec-title">Encoder & Decoder</h1>
        </div>

        <nav class="misc-tools" aria-label="Misc tools">
          <a href="/misc/">Misc Home</a>
          <a href="/misc/lambda/">Lambda Projects</a>
        </nav>

        <label class="secret-field">
          <span>Secret thing</span>
          <input id="secret" type="text" value="0" autocomplete="off" spellcheck="false">
        </label>

        <div class="codec-grid">
          <label>
            <span class="field-title">
              Encode
              <button id="copy-encode" class="copy-button" type="button">Copy</button>
            </span>
            <textarea id="encode" rows="12" spellcheck="false" placeholder="Type plain text here"></textarea>
          </label>
          <label>
            <span class="field-title">
              Decode
              <button id="copy-decode" class="copy-button" type="button">Copy</button>
            </span>
            <textarea id="decode" rows="12" spellcheck="false" placeholder="Encoded text appears here"></textarea>
          </label>
        </div>

        <p class="codec-status" id="status" aria-live="polite">Secret thing starts at 0.</p>
      </section>
    </main>
    <script src="/misc/coder/coder.js?v=1"></script>
  </body>
</html>
