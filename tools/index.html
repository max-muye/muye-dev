<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Muye misc tools.">
    <title>Tools · Muye</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="/styles.css?v=11">
    <link rel="stylesheet" href="/assets/tools.css?v=1">
    <link rel="stylesheet" href="/assets/site-footer.css?v=1">
  </head>
  <body class="misc-page">
    <main class="misc-shell">
      <header class="misc-topbar">
        <a class="misc-brand" href="/">Muye</a>
        <a class="misc-home" href="/">Home</a>
      </header>

      <section class="codec-tool misc-hub" aria-labelledby="misc-title">
        <div>
          <p class="eyebrow">Tools</p>
          <h1 id="misc-title">Tools Tools</h1>
        </div>

        <nav class="misc-tools" aria-label="Tools tools">
          <a href="/tools/browser/">Browser</a>
          <a href="/tools/base64/">Base64</a>
          <a href="/tools/unicode-art/">Unicode Art</a>
          <a href="/tools/unicode-viewer/">Unicode Viewer</a>
          <a href="/tools/emoji-joiner/" id="emoji-joiner-link">Emoji Joiner</a>
          <a href="/tools/invisible-characters/" id="invisible-characters-link">Invisible Characters</a>
          <a href="/tools/passwd/">Password tools</a>
          <a href="/tools/passwd/aes/">AES</a>
          <a href="/tools/collatz/">Collatz</a>
          <a href="/tools/lambda/">Lambda Projects</a>
          <a href="/tool/ascii/">ASCII</a>
        </nav>
      </section>
    </main>
    <script>
      (() => {
        const labels = { en:"Emoji Joiner", zh:"表情连接器", ja:"絵文字ジョイナー", ko:"이모지 조합기", es:"Unidor de emojis", fr:"Assembleur d’émojis", de:"Emoji-Verbinder", pt:"Juntador de emojis", ru:"Сборщик эмодзи", ar:"موصّل الرموز التعبيرية" };
        const invisibleLabels = { en:"Invisible Characters", zh:"不可见字符", ja:"不可視文字", ko:"보이지 않는 문자", es:"Caracteres invisibles", fr:"Caractères invisibles", de:"Unsichtbare Zeichen", pt:"Caracteres invisíveis", ru:"Невидимые символы", ar:"محارف غير مرئية" };
        const link = document.querySelector("#emoji-joiner-link");
        const invisibleLink = document.querySelector("#invisible-characters-link");
        const render = () => { const language = localStorage.getItem("muye-lang"); link.textContent = labels[language] || labels.en; invisibleLink.textContent = invisibleLabels[language] || invisibleLabels.en; };
        render();
        window.addEventListener("storage", render);
        window.addEventListener("muye-language-change", render);
      })();
    </script>
    <script src="/assets/site-footer.js?v=1"></script>
  </body>
</html>
