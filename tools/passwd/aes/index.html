<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Encrypt and decrypt text locally with AES-GCM and a password.">
    <title>AES · Muye</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="/styles.css?v=11">
    <link rel="stylesheet" href="/tools/coder/coder.css?v=1">
    <link rel="stylesheet" href="/tools/passwd/passwd.css?v=2">
    <link rel="stylesheet" href="/assets/site-footer.css?v=1">
  </head>
  <body class="misc-page">
    <main class="misc-shell">
      <header class="misc-topbar">
        <a class="misc-brand" href="/">Muye</a>
        <a class="misc-home" href="/tools/passwd/" data-i18n="passwordTools">Password tools</a>
      </header>
      <section class="codec-tool passwd-tool" aria-labelledby="aes-title">
        <div class="passwd-head">
          <div>
            <p class="eyebrow" data-i18n="eyebrow">Tools / Symmetric encryption</p>
            <h1 id="aes-title">AES</h1>
          </div>
          <button class="copy-button" id="language" type="button" aria-label="Change language">A中</button>
        </div>
        <nav class="misc-tools" aria-label="Password tools">
          <a href="/tools/passwd/" data-i18n="passwordTools">Password tools</a>
          <a href="/passwd/hash/">PBKDF2-SHA256</a>
          <a href="/tools/passwd/rsa/">RSA</a>
        </nav>
        <p class="passwd-note" data-i18n="intro">AES-GCM encrypts and authenticates a message with one secret key. This page derives that key from your password and runs entirely in your browser.</p>
        <div class="passwd-grid">
          <form class="passwd-card" id="encrypt-form">
            <h2 data-i18n="encrypt">Encrypt</h2>
            <label><span data-i18n="password">Password</span><input id="encrypt-password" type="password" minlength="8" required autocomplete="new-password"></label>
            <label><span data-i18n="message">Message</span><textarea id="plain-text" rows="7" required></textarea></label>
            <button class="copy-button primary-action" type="submit" data-i18n="encryptButton">Encrypt message</button>
          </form>
          <form class="passwd-card" id="decrypt-form">
            <h2 data-i18n="decrypt">Decrypt</h2>
            <label><span data-i18n="password">Password</span><input id="decrypt-password" type="password" required autocomplete="current-password"></label>
            <label><span data-i18n="encrypted">Encrypted text</span><textarea id="encrypted-text" rows="7" required></textarea></label>
            <button class="copy-button primary-action" type="submit" data-i18n="decryptButton">Decrypt message</button>
          </form>
        </div>
        <section class="passwd-card rsa-output" aria-live="polite">
          <h2 data-i18n="result">Result</h2>
          <p class="codec-status" id="status"></p>
          <textarea id="result-text" rows="5" readonly></textarea>
          <button class="copy-button" id="copy-result" type="button" data-i18n="copy">Copy</button>
        </section>
      </section>
    </main>
    <script src="/tools/passwd/aes/aes.js?v=1"></script>
    <script src="/assets/site-footer.js?v=1"></script>
  </body>
</html>
